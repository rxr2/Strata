<text x="20" y="30" font-size="18" font-weight="600" fill="#1b1f24">Strata on RX 7900 XTX: where the data flows and how busy each part is</text>
<text x="20" y="50" font-size="12" fill="#57606a">Qwen3.8-Flash-Next IQ3_S, Strata 0.1.52, tuned config. Measured live (amdgpu_top, /proc) during a 34K-token prompt + 512-token answer.</text><text x="20" y="66" font-size="12" fill="#57606a">"est." = derived from engine counters (this platform exposes no PCIe or DRAM bandwidth counter).</text>
<text x="20" y="96" font-size="15" font-weight="600" fill="#1b1f24">Prefill (34K prompt, ~2,900 tok/s live; 3,180 tok/s in the 12K-64K benchmark)</text>
<text x="20" y="114" font-size="12" fill="#57606a">bound by GPU compute: expert GEMMs 25%, GDN 11%, QSA select/attention 20%, HC 14% of GPU time at 64K</text>
